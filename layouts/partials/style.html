<style>
  /* Paper: book-like serif reading, warm off-white. */
  :root, [data-theme="light"] {
    --bg: #fbfaf7; --text: #2b2b2b; --muted: #77736b; --heading: #111;
    --link: #8a3b12; --rule: #e6e2d9; --code-bg: #f1eee7;
  }
  [data-theme="dark"] {
    --bg: #1c1b19; --text: #d9d5cc; --muted: #8f8a80; --heading: #f2efe8;
    --link: #e0a37a; --rule: #34322e; --code-bg: #262522;
  }
  body {
    margin: 0 auto; padding: 3rem 1.25rem; max-width: 38rem;
    font: 1.125rem/1.75 Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; overflow-wrap: break-word;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; margin-bottom: 3rem; }
  .title { text-decoration: none; }
  .title h2 { margin: 0; font-size: 1.25rem; color: var(--heading); font-weight: 700; }
  nav { display: flex; gap: 1.1rem; align-items: baseline; font-size: .95rem; font-style: italic; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--link); }
  h1, h2, h3, h4 { color: var(--heading); line-height: 1.25; font-weight: 700; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  h2 { font-size: 1.4rem; margin-top: 2.5rem; }
  h3 { font-size: 1.15rem; margin-top: 2rem; }
  h1 + p time { color: var(--muted); font-style: italic; font-size: .95rem; }
  a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  strong, b { color: var(--heading); }
  img { max-width: 100%; height: auto; display: block; margin: 2rem auto; border-radius: 2px; }
  hr { border: 0; text-align: center; margin: 2.5rem 0; }
  hr::after { content: "* * *"; color: var(--muted); letter-spacing: .5em; }
  blockquote { margin: 1.5rem 0; padding-left: 1.25rem; border-left: 2px solid var(--link); color: var(--muted); font-style: italic; }
  code { font: .85em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: .1em .35em; border-radius: 3px; }
  pre { padding: 1rem; border-radius: 4px; overflow-x: auto; line-height: 1.5; font-size: .95rem; background: var(--code-bg); }
  pre code { background: none; padding: 0; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { border-bottom: 1px solid var(--rule); padding: .4rem .5rem; text-align: left; }
  ul.blog-posts { list-style: none; padding: 0; }
  ul.blog-posts li { display: flex; gap: 1.5rem; padding: .5rem 0; border-bottom: 1px solid var(--rule); }
  ul.blog-posts li span { flex: 0 0 7.5rem; color: var(--muted); font-style: italic; font-size: .95rem; }
  ul.blog-posts li a { text-decoration: none; color: var(--heading); }
  ul.blog-posts li a:hover { color: var(--link); }
  ul.blog-posts i { font-style: inherit; }
  .theme-toggle { background: none; border: 0; padding: 0; cursor: pointer; font-size: .95rem; color: var(--muted); }
  footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; text-align: center; }
  @media (max-width: 520px) { ul.blog-posts li { flex-direction: column; gap: 0; } ul.blog-posts li span { flex: none; } }
</style>
